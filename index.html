<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF6B00" />

    <!-- Search Engine & Canonical -->
    <meta name="description" content="Custom web platforms, mobile apps, enterprise cloud systems, and AI automations. Senior engineering collective delivering robust digital solutions." />
    <meta name="keywords" content="Arivom Technologies, Enterprise Software Development, Web Development Company, Custom Web Applications, React Native Mobile, Spring Boot, Cloud Consulting, AI Automation" />
    <meta name="author" content="Arivom Technologies" />
    <link rel="canonical" href="https://arivomtechnologies.com/" />

    <!-- Open Graph / WhatsApp / Facebook / LinkedIn / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arivom Technologies" />
    <meta property="og:url" content="https://arivomtechnologies.com/" />
    <meta property="og:title" content="Arivom Technologies — Enterprise Software & Web Development" />
    <meta property="og:description" content="Custom web platforms, mobile apps, enterprise cloud systems, and AI automations. Senior engineering collective delivering robust digital solutions." />

    <!-- Primary Square Thumbnail for WhatsApp & Direct Messaging (1:1 Ratio, < 100KB) -->
    <meta property="og:image" content="https://arivomtechnologies.com/images/arivom-share-square.jpg" />
    <meta property="og:image:secure_url" content="https://arivomtechnologies.com/images/arivom-share-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Arivom Technologies Brand Logo" />

    <!-- Full-Width Banner for Facebook, LinkedIn & Twitter Large Image -->
    <meta property="og:image" content="https://arivomtechnologies.com/images/arivom-share-banner.jpg" />
    <meta property="og:image:secure_url" content="https://arivomtechnologies.com/images/arivom-share-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arivom Technologies Senior Engineering Collective" />

    <!-- Fallback Image Discovery for Messaging Apps -->
    <meta itemprop="image" content="https://arivomtechnologies.com/images/arivom-share-square.jpg" />
    <link rel="image_src" href="https://arivomtechnologies.com/images/arivom-share-square.jpg" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://arivomtechnologies.com/" />
    <meta name="twitter:title" content="Arivom Technologies — Enterprise Software & Web Development" />
    <meta name="twitter:description" content="Custom web platforms, mobile apps, enterprise cloud systems, and AI automations. Senior engineering collective delivering robust digital solutions." />
    <meta name="twitter:image" content="https://arivomtechnologies.com/images/arivom-share-banner.jpg" />
    <meta name="twitter:image:alt" content="Arivom Technologies Official Brand Banner" />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
